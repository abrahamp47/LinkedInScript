# LinkedInScript Configuration
# Copy this file to config.yaml and customize your settings.
# Run: python main.py (first run will copy this automatically)

search:
  # Keywords to search (each triggers a separate LinkedIn query)
  keywords:
    - "software engineer intern"
    - "SDE intern"
    - "software developer intern"
    - "data science intern"
    - "ML intern"
    - "backend developer intern"
    - "frontend developer intern"
    - "full stack intern"
    - "DevOps intern"

  # Locations to search (tool iterates keyword x location combinations)
  locations:
    - "Bengaluru, Karnataka, India"
    - "India"

  # Max results per keyword-location combination (25 per page, 75 = 3 pages)
  results_wanted: 75

  # Only fetch jobs posted within this many hours
  hours_old: 24

# Rate limiting between scrape calls
scraping:
  min_delay: 5
  max_delay: 12

companies:
  # Priority companies - always included, salary filter waived
  watchlist:
    # Tier S: Elite (FAANG + Quant)
    - "Google"
    - "Microsoft"
    - "Amazon"
    - "Adobe"
    - "Apple"
    - "Meta"
    - "Rubrik"
    - "Tower Research"
    - "DE Shaw"
    - "QuadEye"
    - "Graviton"
    # Tier 1: Top Product Companies
    - "Flipkart"
    - "Uber"
    - "Goldman Sachs"
    - "Salesforce"
    - "LinkedIn"
    - "Atlassian"
    - "Nvidia"
    - "Coinbase"
    - "Stripe"
    - "Airbnb"
    # Tier 2: Strong Indian Startups
    - "Razorpay"
    - "PhonePe"
    - "Zerodha"
    - "CRED"
    - "Meesho"
    - "Groww"
    - "Swiggy"
    - "Postman"
    - "Rippling"
    - "Harness"
    - "Hasura"
    - "Gojek"
    - "InMobi"
    - "Nutanix"
    - "Autodesk"
    # Tier 3: Solid Growth Ladder
    - "JP Morgan"
    - "Morgan Stanley"
    - "Fidelity"
    - "Intuit"
    - "Walmart"
    - "VMware"
    - "ServiceNow"
    - "Palo Alto Networks"
    - "Target"
    - "Cisco"
    - "Mastercard"
    - "Oracle"
    - "PayPal"
    - "Visa"
    - "SAP"
    - "Freshworks"
    - "GitLab"
    - "GitHub"
    - "Datadog"
    - "Shopify"
    - "InfraCloud"
    - "Bajaj Finserv"
    - "Nokia"

  # Companies to always reject
  blocklist:
    # Service/IT consulting (low pay, bonds, no growth)
    - "TCS"
    - "Infosys"
    - "Wipro"
    - "HCL"
    - "Cognizant"
    - "Tech Mahindra"
    - "Capgemini"
    - "Accenture"
    - "Mu Sigma"
    - "Kellton"
    - "Virtusa"
    - "Deloitte"
    - "Mphasis"
    - "Mindtree"
    - "LTIMindtree"
    - "L&T Infotech"
    - "Hexaware"
    - "Cyient"
    - "NIIT"
    - "iGate"
    # Toxic culture / exploitative (from r/developersindia reports)
    - "Coding Ninjas"
    - "Upstox"
    - "Zeta"
    - "Oyo"
    - "Byju's"
    - "Unacademy"
    - "WhiteHat Jr"

filters:
  min_salary_monthly: 30000

  # Bangalore area aliases for location matching (case-insensitive)
  location_aliases:
    - "bangalore"
    - "bengaluru"
    - "bengaluru urban"
    - "whitefield"
    - "electronic city"
    - "koramangala"
    - "indiranagar"
    - "hsr layout"
    - "marathahalli"

  # Keywords that indicate remote/flexible location (case-insensitive)
  remote_keywords:
    - "remote"
    - "work from home"
    - "wfh"
    - "pan india"
    - "anywhere in india"
    - "hybrid"

# Email notifications (functional in Phase 4)
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "your.email@gmail.com"
  recipient_email: "your.email@gmail.com"

# Logging
logging:
  level: "INFO"
  file: "logs/run.log"
  max_size_mb: 5
  backup_count: 3

# Task Scheduler settings (used by scripts/install-task.ps1)
schedule:
  time: "08:00"  # Daily run time (24h format HH:MM)

# Database maintenance
database:
  retention_days: 90  # Auto-purge entries older than this many days (D-15)
